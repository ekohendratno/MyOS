# locale.conf — Default locale dan timezone mixos
# File ini di-source oleh hook untuk menulis /etc/default/locale.

# === Locale ===
LANG="en_US.UTF-8"
LANGUAGE="en_US:en"
LC_ALL="en_US.UTF-8"
LC_CTYPE="en_US.UTF-8"
LC_NUMERIC="en_US.UTF-8"
LC_TIME="en_US.UTF-8"
LC_COLLATE="en_US.UTF-8"
LC_MONETARY="en_US.UTF-8"
LC_MESSAGES="en_US.UTF-8"
LC_PAPER="en_US.UTF-8"
LC_NAME="en_US.UTF-8"
LC_ADDRESS="en_US.UTF-8"
LC_TELEPHONE="en_US.UTF-8"
LC_MEASUREMENT="en_US.UTF-8"
LC_IDENTIFICATION="en_US.UTF-8"

# === Keyboard layout ===
XKBLAYOUT="us"
XKBVARIANT=""
XKBOPTIONS="compose:rwin,terminate:ctrl_alt_bksp"

# === Timezone ===
TZ="UTC"

# === Catatan ===
# User akan diminta untuk set locale dan timezone saat first boot
# via mixos-welcome atau gnome-initial-setup.
