# mixos.conf — Konfigurasi utama project
# File ini dibaca oleh build.sh dan hook scripts.
# WAJIB valid bash variable assignment (KEY="VALUE").

# === Identitas Project ===
PROJECT_NAME="mixos"
PROJECT_DISPLAY_NAME="mixos"
PROJECT_DESCRIPTION="macOS-inspired Linux desktop based on elementary OS"
PROJECT_CODENAME="horizon"           # nama kode rilis, ganti per rilis
PROJECT_VERSION="0.1.0"              # versi semver
PROJECT_VERSION_ID="0.1"             # versi numeric untuk os-release
PROJECT_PRETTY_VERSION="0.1 (Horizon)"  # versi cantik untuk About
PROJECT_BUILD_DATE=""                 # auto-generated oleh build.sh
PROJECT_BUILD_BRANCH=""               # auto-detected oleh build.sh

# === Branding ===
PROJECT_LOGO_PATH="branding/logo/mixos-logo.svg"
PROJECT_LOGO_PNG_PATH="branding/logo/mixos-logo.png"
PROJECT_WALLPAPER_DEFAULT="branding/wallpaper/mixos-default.jpg"
PROJECT_WALLPAPER_DARK="branding/wallpaper/mixos-dark.jpg"
PROJECT_ICON_THEME="mixos-icons"
PROJECT_CURSOR_THEME="mixos-cursors"
PROJECT_GTK_THEME="mixos-gtk"
PROJECT_SHELL_THEME="mixos-shell"
PROJECT_PLINK_THEME="mixos-plank"

# === Default Hostname ===
PROJECT_DEFAULT_HOSTNAME="mixos-host"
PROJECT_DEFAULT_USERNAME="mixos"
PROJECT_DEFAULT_DISK_LABEL="MIXOS"

# === Identifikasi ISO ===
ISO_VOLUME_ID="MIXOS"
ISO_VOLUME_SET_ID="mixos-${PROJECT_CODENAME}"
ISO_PUBLISHER="mixos project; https://github.com/$(whoami)/mixos"
ISO_APPLICATION_ID="mixos-installer-${PROJECT_VERSION}"
ISO_SYSTEM_ID="MIXOS"

# === Basis ===
BASE_DISTRO="elementary"
BASE_DISTRO_VERSION="8.1"
BASE_DISTRO_URL="https://github.com/elementary/os"
BASE_ARCH="amd64"
BASE_LOCALE="en_US.UTF-8"
BASE_LANGUAGE="en"
BASE_TIMEZONE="UTC"

# === Build Behavior ===
ENABLE_BRANDING_OVERRIDE="true"
ENABLE_THEME_OVERRIDE="true"
ENABLE_PANTHEON_PATCHES="true"
ENABLE_GLOBAL_MENU_EXPERIMENT="false"   # default OFF di tahap awal
ENABLE_FINDER_PATCH="false"             # default OFF
ENABLE_SETTINGS_PATCH="false"           # default OFF
ENABLE_SECURITY_HARDENING="true"
ENABLE_FIREFOX_DEFAULT="false"          # default browser Firefox
ENABLE_CHROMIUM_DEFAULT="false"         # alternative
ENABLE_BUILD_CACHE="true"
CLEAN_BEFORE_BUILD="false"

# === Build Output ===
BUILD_DIR="builds"
UPSTREAM_DIR="upstream"
CACHE_DIR="cache"
LOG_DIR="logs"
ARTIFACT_DIR="artifacts"

# === Fitur Eksperimental ===
FEATURE_HOT_CORNERS="false"
FEATURE_DOCK_INTELLIHIDE="true"
FEATURE_PANEL_TRANSPARENCY="false"
FEATURE_GLOBAL_DARK_MODE="true"
FEATURE_AUTO_UPDATE_CHECK="false"        # default OFF, privasi
FEATURE_TELEMETRY="false"                # WAJIB false
FEATURE_LOCATION_SERVICES="false"        # default OFF, privasi
FEATURE_REPORT_CRASH="false"             # WAJIB false

# === Network ===
ENABLE_NETWORK_MANAGER="true"
ENABLE_BLUETOOTH="true"
ENABLE_FIREWALL_UFW="true"
ENABLE_SSHD="false"                      # default OFF, security

# === Repositori Tambahan ===
ENABLE_FLATPAK="true"
ENABLE_SNAPD="false"                     # default OFF, license concerns
ENABLE_PPA_PIPER="false"                 # gaming tools, opsional
ENABLE_PPA_OBS="false"                   # OBS Studio, opsional

# === Path ===
PATH_BRANDING="branding"
PATH_THEMES="themes"
PATH_PATCHES="patches"
PATH_HOOKS="hooks"
PATH_CONFIG="config"
PATH_SCRIPTS="scripts"
PATH_DOCS="docs"
