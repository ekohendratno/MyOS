# os-release.conf — Variabel untuk /etc/os-release
# File ini di-source oleh hook script untuk generate /etc/os-release final.

# === Wajib di os-release ===
OS_NAME="mixos"
OS_PRETTY_NAME="mixos 0.1 (Horizon)"
OS_ID="mixos"
OS_ID_LIKE="elementary ubuntu debian"
OS_VERSION="0.1 (Horizon)"
OS_VERSION_ID="0.1"
OS_VERSION_CODENAME="horizon"
OS_BUILD_ID=""

# === Identitas Tambahan ===
OS_HOME_URL="https://github.com/$(whoami)/mixos"
OS_SUPPORT_URL="https://github.com/$(whoami)/mixos/issues"
OS_BUG_REPORT_URL="https://github.com/$(whoami)/mixos/issues/new"
OS_PRIVACY_POLICY_URL="https://github.com/$(whoami)/mixos/blob/main/docs/LEGAL_NOTES.md"
OS_DOCUMENTATION_URL="https://github.com/$(whoami)/mixos/blob/main/docs/"

# === Identifikasi OEM ===
VENDOR_NAME="mixos project"
VENDOR_URL="https://github.com/$(whoami)/mixos"

# === Catatan ===
# File ini TIDAK dipakai langsung oleh /etc/os-release. Hook script akan
# membaca variabel di atas dan menulis /etc/os-release ke chroot dengan
# format standar. Lihat hooks/003-apply-branding.sh.
