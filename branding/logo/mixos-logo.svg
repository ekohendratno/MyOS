<?xml version="1.0" encoding="UTF-8"?>
<!--
  mixos logo — placeholder SVG
  Desain: simple geometric, tidak侵犯 trademark pihak ketiga.
  Lisensi: MIT (mixos project)
  Boleh dimodifikasi, digunakan, dan didistribusikan ulang.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <linearGradient id="mixosGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a84ff"/>
      <stop offset="50%" stop-color="#5856d6"/>
      <stop offset="100%" stop-color="#af52de"/>
    </linearGradient>
  </defs>

  <!-- Background circle -->
  <circle cx="128" cy="128" r="120" fill="url(#mixosGrad)"/>

  <!-- Abstract "M" shape -->
  <!-- Path: simple stylized M dengan dua valley -->
  <path d="M 60 70 L 60 186 L 80 186 L 80 110 L 116 170 L 140 170 L 176 110 L 176 186 L 196 186 L 196 70 L 168 70 L 128 144 L 88 70 Z"
        fill="white"
        stroke="none"/>

  <!-- Subtitle -->
  <text x="128" y="220"
        font-family="Inter, Cantarell, sans-serif"
        font-size="20"
        font-weight="600"
        fill="white"
        text-anchor="middle"
        letter-spacing="2">mixos</text>
</svg>
