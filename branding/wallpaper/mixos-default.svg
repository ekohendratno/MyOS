<?xml version="1.0" encoding="UTF-8"?>
<!--
  mixos default wallpaper — placeholder
  Ukuran: 5120x2880 (16:9). Compress ke JPG/PNG nanti.
  Tema: gradient tenang biru-ungu, dengan sun/star di pojok.
  Lisensi: MIT (mixos project)
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 5120 2880" width="5120" height="2880" preserveAspectRatio="xMidYMid slice">
  <defs>
    <!-- Gradient utama: atas gelap, bawah lebih terang -->
    <linearGradient id="skyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0a0e27"/>
      <stop offset="30%" stop-color="#1a1f4e"/>
      <stop offset="60%" stop-color="#3a3d8a"/>
      <stop offset="100%" stop-color="#5e5ec4"/>
    </linearGradient>

    <!-- Glow effect untuk bulan/sun -->
    <radialGradient id="moonGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.9"/>
      <stop offset="50%" stop-color="#a0a8ff" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#5e5ec4" stop-opacity="0"/>
    </radialGradient>

    <!-- Vignette -->
    <radialGradient id="vignette" cx="50%" cy="50%" r="70%">
      <stop offset="60%" stop-color="#000000" stop-opacity="0"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.4"/>
    </radialGradient>
  </defs>

  <!-- Background gradient -->
  <rect width="5120" height="2880" fill="url(#skyGrad)"/>

  <!-- Bintang-bintang (small white dots, distribusi acak) -->
  <g fill="#ffffff" opacity="0.6">
    <circle cx="200" cy="300" r="1.5"/>
    <circle cx="450" cy="180" r="2"/>
    <circle cx="780" cy="420" r="1"/>
    <circle cx="1200" cy="240" r="1.8"/>
    <circle cx="1580" cy="380" r="1.2"/>
    <circle cx="1900" cy="180" r="2.2"/>
    <circle cx="2200" cy="450" r="1.5"/>
    <circle cx="2500" cy="220" r="1.8"/>
    <circle cx="2800" cy="380" r="1"/>
    <circle cx="3100" cy="200" r="1.6"/>
    <circle cx="3400" cy="420" r="2"/>
    <circle cx="3700" cy="260" r="1.3"/>
    <circle cx="4000" cy="180" r="1.8"/>
    <circle cx="4300" cy="400" r="1.5"/>
    <circle cx="4600" cy="240" r="1.2"/>
    <circle cx="4900" cy="380" r="1.7"/>
    <circle cx="350" cy="600" r="1.4"/>
    <circle cx="950" cy="800" r="1.8"/>
    <circle cx="1700" cy="700" r="1.2"/>
    <circle cx="2400" cy="850" r="1.6"/>
    <circle cx="3200" cy="780" r="1.4"/>
    <circle cx="4100" cy="900" r="1.8"/>
  </g>

  <!-- Bulan/sun dengan glow -->
  <circle cx="4400" cy="700" r="180" fill="url(#moonGlow)"/>
  <circle cx="4400" cy="700" r="120" fill="#f0f4ff" opacity="0.95"/>

  <!-- Gunung silhouette di bawah (subtle) -->
  <path d="M 0 2400 L 400 2000 L 800 2200 L 1200 1900 L 1600 2100 L 2000 1950 L 2400 2150 L 2800 2000 L 3200 2200 L 3600 2050 L 4000 2150 L 4400 2000 L 4800 2100 L 5120 2050 L 5120 2880 L 0 2880 Z"
        fill="#0a0e27"
        opacity="0.5"/>

  <!-- Vignette overlay -->
  <rect width="5120" height="2880" fill="url(#vignette)"/>

  <!-- Subtle text watermark (kecil, di tengah bawah) -->
  <text x="2560" y="2780"
        font-family="Inter, Cantarell, sans-serif"
        font-size="42"
        font-weight="300"
        fill="#ffffff"
        opacity="0.3"
        text-anchor="middle"
        letter-spacing="6">MIXOS</text>
</svg>
